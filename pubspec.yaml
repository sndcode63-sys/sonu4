name: diginiwas
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management & routing (GetX)
  get: ^4.6.6

  # Location
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Networking
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.4.0

  # Secure storage (tokens)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  google_maps_flutter: ^2.18.0

  # Push notifications
  firebase_core: ^3.3.0
  firebase_auth: ^5.3.1   # Phone OTP login (Firebase Auth)
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2
  image_picker: ^1.1.2
  http_parser: ^4.0.2
  file_picker: ^8.0.0
  mime: ^2.0.0
  pinput: ^6.0.2
  screenshot: ^3.0.0
  path_provider: ^2.1.5
  speech_to_text: ^7.2.0

  # Responsive sizing
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  geocoding: ^5.0.0
  latlong2: ^0.9.1
  panorama_viewer: ^2.0.7
  url_launcher: ^6.3.0
  share_plus: ^12.0.2

  # Logging
  logger: ^2.4.0
  google_fonts: ^6.2.1

  intl: any
  video_player: ^2.14.0

  # Payments (partner credit top-up)
  razorpay_flutter: ^1.4.0
  flutter_bloc: ^9.1.1
  go_router: ^17.5.0
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/diginiwas_logo_reveal_9x16_1080p.mp4
    - assets/images/app_icon.png
    - assets/images/
    - assets/images/partner/
    - assets/images/empty_states/