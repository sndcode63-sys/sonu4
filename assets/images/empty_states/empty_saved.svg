<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="60%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <ellipse cx="120" cy="155" rx="90" ry="24" fill="url(#glowGrad)"/>

  <!-- Ground Island -->
  <ellipse cx="120" cy="158" rx="80" ry="18" fill="url(#cloudGrad)"/>
  <ellipse cx="120" cy="155" rx="72" ry="14" fill="#FFFFFF"/>

  <!-- Bushes -->
  <circle cx="66" cy="146" r="14" fill="#6EE7B7"/>
  <circle cx="76" cy="142" r="11" fill="#34D399"/>
  <circle cx="172" cy="145" r="13" fill="#6EE7B7"/>
  <circle cx="162" cy="148" r="10" fill="#34D399"/>

  <!-- Document Card with Property -->
  <g filter="url(#softShadow)">
    <rect x="80" y="48" width="80" height="98" rx="14" fill="url(#docGrad)" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Property Roof & House on document -->
    <path d="M120 62L102 76V94H138V76L120 62Z" fill="#3B82F6"/>
    <rect x="116" y="82" width="8" height="12" rx="1" fill="#FFFFFF"/>
    
    <!-- Text Lines on document -->
    <rect x="94" y="104" width="52" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="94" y="112" width="38" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="94" y="120" width="46" height="4" rx="2" fill="#E2E8F0"/>
  </g>

  <!-- Big Red Floating Wishlist Heart Badge -->
  <g filter="url(#softShadow)">
    <circle cx="156" cy="122" r="24" fill="#FFFFFF"/>
    <circle cx="156" cy="122" r="20" fill="url(#heartGrad)"/>
    <!-- Heart Icon -->
    <path d="M156 132.5L154.55 131.18C149.4 126.51 146 123.43 146 119.65C146 116.57 148.42 114.15 151.5 114.15C153.24 114.15 154.91 114.96 156 116.24C157.09 114.96 158.76 114.15 160.5 114.15C163.58 114.15 166 116.57 166 119.65C166 123.43 162.6 126.51 157.45 131.18L156 132.5Z" fill="#FFFFFF"/>
  </g>

  <!-- Sparkles -->
  <path d="M58 74L60 79L65 81L60 83L58 88L56 83L51 81L56 79L58 74Z" fill="#F43F5E"/>
  <path d="M184 62L185.5 66.5L190 68L185.5 69.5L184 74L182.5 69.5L178 68L182.5 66.5L184 62Z" fill="#FBBF24"/>
  <circle cx="72" cy="110" r="3" fill="#38BDF8"/>
</svg>
