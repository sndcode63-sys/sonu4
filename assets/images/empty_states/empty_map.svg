<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="mapGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="mapGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ground Island -->
  <ellipse cx="120" cy="158" rx="84" ry="18" fill="url(#cloudGrad)"/>
  <ellipse cx="120" cy="155" rx="76" ry="14" fill="#FFFFFF"/>

  <!-- Bushes -->
  <circle cx="64" cy="146" r="14" fill="#6EE7B7"/>
  <circle cx="74" cy="142" r="11" fill="#34D399"/>
  <circle cx="174" cy="145" r="13" fill="#6EE7B7"/>
  <circle cx="164" cy="148" r="10" fill="#34D399"/>

  <!-- Folded Map -->
  <g filter="url(#softShadow)">
    <!-- Fold 1 (Left) -->
    <path d="M72 74L100 62V136L72 148V74Z" fill="url(#mapGrad1)" stroke="#CBD5E1" stroke-width="1.2"/>
    <!-- Fold 2 (Middle) -->
    <path d="M100 62L138 72V146L100 136V62Z" fill="url(#mapGrad2)" stroke="#CBD5E1" stroke-width="1.2"/>
    <!-- Fold 3 (Right) -->
    <path d="M138 72L168 60V134L138 146V72Z" fill="url(#mapGrad1)" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- Map Road Lines -->
    <path d="M80 110Q95 100 100 105T138 100T160 95" stroke="#93C5FD" stroke-width="3" stroke-dasharray="4 3" fill="none"/>
  </g>

  <!-- Big Red Map Pin -->
  <g filter="url(#softShadow)">
    <path d="M120 42C108.95 42 100 50.95 100 62C100 76.5 120 98 120 98C120 98 140 76.5 140 62C140 50.95 131.05 42 120 42Z" fill="url(#pinGrad)"/>
    <circle cx="120" cy="62" r="7" fill="#FFFFFF"/>
    <circle cx="120" cy="62" r="3.5" fill="#EF4444"/>
  </g>

  <!-- Sparkles -->
  <path d="M58 56L60 61L65 63L60 65L58 70L56 65L51 63L56 61L58 56Z" fill="#FBBF24"/>
  <path d="M182 52L183.5 56.5L188 58L183.5 59.5L182 64L180.5 59.5L176 58L180.5 56.5L182 52Z" fill="#38BDF8"/>
</svg>
