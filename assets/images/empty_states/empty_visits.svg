<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="calGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ground Island -->
  <ellipse cx="120" cy="158" rx="80" ry="18" fill="url(#cloudGrad)"/>
  <ellipse cx="120" cy="155" rx="72" ry="14" fill="#FFFFFF"/>

  <!-- Bushes -->
  <circle cx="68" cy="146" r="14" fill="#6EE7B7"/>
  <circle cx="78" cy="142" r="11" fill="#34D399"/>
  <circle cx="170" cy="145" r="13" fill="#6EE7B7"/>
  <circle cx="160" cy="148" r="10" fill="#34D399"/>

  <!-- Calendar Page -->
  <g filter="url(#softShadow)">
    <rect x="74" y="52" width="92" height="92" rx="16" fill="url(#calGrad)" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Calendar Top Bar -->
    <path d="M74 68C74 59.16 81.16 52 90 52H150C158.84 52 166 59.16 166 68V72H74V68Z" fill="#2563EB"/>
    
    <!-- Rings -->
    <rect x="94" y="46" width="6" height="12" rx="3" fill="#1E3A8A"/>
    <rect x="140" y="46" width="6" height="12" rx="3" fill="#1E3A8A"/>

    <!-- Calendar Grid Dots / Cells -->
    <rect x="88" y="84" width="12" height="10" rx="3" fill="#DBEAFE"/>
    <rect x="106" y="84" width="12" height="10" rx="3" fill="#DBEAFE"/>
    <rect x="124" y="84" width="12" height="10" rx="3" fill="#DBEAFE"/>
    <rect x="142" y="84" width="12" height="10" rx="3" fill="#DBEAFE"/>

    <rect x="88" y="100" width="12" height="10" rx="3" fill="#DBEAFE"/>
    <rect x="106" y="100" width="12" height="10" rx="3" fill="#3B82F6"/>
    <rect x="124" y="100" width="12" height="10" rx="3" fill="#DBEAFE"/>
    <rect x="142" y="100" width="12" height="10" rx="3" fill="#DBEAFE"/>

    <rect x="88" y="116" width="12" height="10" rx="3" fill="#DBEAFE"/>
    <rect x="106" y="116" width="12" height="10" rx="3" fill="#DBEAFE"/>
    <rect x="124" y="116" width="12" height="10" rx="3" fill="#DBEAFE"/>
    <rect x="142" y="116" width="12" height="10" rx="3" fill="#DBEAFE"/>
  </g>

  <!-- Clock Badge Overlay -->
  <g filter="url(#softShadow)">
    <circle cx="160" cy="124" r="22" fill="#FFFFFF"/>
    <circle cx="160" cy="124" r="18" fill="url(#clockGrad)"/>
    <!-- Hands -->
    <circle cx="160" cy="124" r="2.5" fill="#FFFFFF"/>
    <line x1="160" y1="124" x2="160" y2="114" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="160" y1="124" x2="168" y2="124" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Sparkles -->
  <path d="M56 70L58 75L63 77L58 79L56 84L54 79L49 77L54 75L56 70Z" fill="#FBBF24"/>
</svg>
